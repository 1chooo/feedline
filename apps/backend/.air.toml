root = "."
tmp_dir = "tmp"

[build]
  cmd = "CGO_ENABLED=0 go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "bin"]
  exclude_regex = ["_test\\.go"]
  log = "air.log"
  poll = true
  poll_interval = 500
  delay = 1000
  stop_on_error = true
